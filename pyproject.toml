[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-mlink-lakehouse"
version = "0.1.0"
description = "Portfolio-safe reference for resilient market-data streaming into a Databricks-style lakehouse"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mlink-demo = "mlink_lakehouse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

