resources:
  jobs:
    synthetic_market_data_pipeline:
      name: synthetic-market-data-pipeline
      tasks:
        - task_key: bronze_to_silver
          spark_python_task:
            python_file: ./01_bronze_to_silver.py
          job_cluster_key: small_cluster
      job_clusters:
        - job_cluster_key: small_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: CHANGE_ME
            num_workers: 1
            data_security_mode: SINGLE_USER

